syntax = "proto2";

import "fown.proto";
import "pidfs.proto";

message pidfd_entry {
	required uint32		id		= 1;
	/*
	 * The pidfs inode number of the struct pid this pidfd refers to.
	 * Since Linux 6.9 pidfs gives every struct pid a unique inode, which
	 * is the only reliable way to tell two of them apart: pid numbers get
	 * reused, and the pidfs attributes of a reaped task (an exit code,
	 * say) are not distinctive at all. Restore keys its stand-in
	 * processes on this, see dead_pid_get().
	 */
	required uint64		ino		= 2;
	required uint32		flags		= 3;
	required int32		nspid		= 4;
	required fown_entry	fown		= 5;
	// pidfs state of the struct pid this pidfd refers to, mirroring
	// pid->attr. Only set when the task has already been reaped
	// (nspid == -1), as that is the only case restore has to reproduce.
	optional pidfs_attr_entry	attr		= 6;
}
