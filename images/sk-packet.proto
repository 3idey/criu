syntax = "proto2";

message sk_ucred_entry {
	required uint32		pid		= 1;
	required uint32		uid		= 2;
	required uint32		gid		= 3;
}

message sk_pidfd_scm_entry {
	required uint32		pid		= 1;
	optional uint64		ino		= 2;
	optional bool		stale		= 3;
}

message scm_entry {
	required uint32			type		= 1;
	repeated uint32			rights		= 2;
	optional sk_ucred_entry		cred		= 3;
	optional sk_pidfd_scm_entry	pidfd		= 4;
}

message sk_packet_entry {
	required uint32		id_for		= 1;
	required uint32		length		= 2;
	// Reserved for message address
	// optional bytes		addr	= 3;
	repeated scm_entry	scm		= 4;
}
